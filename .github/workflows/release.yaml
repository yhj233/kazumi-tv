---
name: "release"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  flutter-build-android:
    name: "Release for android"
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        shell: bash
      - name: Echo build progress
        run: echo "kazumi_tv_${{ env.tag }}_arm64-v8a.apk / kazumi_tv_${{ env.tag }}_armeabi-v7a.apk / kazumi_tv_${{ env.tag }}_x86_64.apk build progress"
        shell: bash
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Build Flutter for Android
        run: |
          flutter build apk --split-per-abi \
            --dart-define=DANDANAPI_APPID=${{ secrets.DANDANAPI_APPID }} \
            --dart-define=DANDANAPI_KEY=${{ secrets.DANDANAPI_KEY }} \
            --dart-define=KAZUMI_APPID=${{ secrets.KAZUMI_APPID }} \
            --dart-define=KAZUMI_KEY=${{ secrets.KAZUMI_KEY }}
        shell: bash
      - name: Package android build output
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "kazumi_tv_${tag}_arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "kazumi_tv_${tag}_armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "kazumi_tv_${tag}_x86_64.apk"
        shell: bash

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi_tv_${{ env.tag }}_arm64-v8a
          path: kazumi_tv_${{ env.tag }}_arm64-v8a.apk
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi_tv_${{ env.tag }}_armeabi-v7a
          path: kazumi_tv_${{ env.tag }}_armeabi-v7a.apk
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi_tv_${{ env.tag }}_x86_64
          path: kazumi_tv_${{ env.tag }}_x86_64.apk


